services:
  kafka:
    restart: always
    image: "bitnami/kafka:3.8.0"
    ports:
      - "9092"
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
    depends_on:
      - zookeeper
  tb-js-executor:
    env_file:
      - queue-kafka.env
    depends_on:
      - kafka
  tb-core:
    env_file:
      - queue-kafka.env
    depends_on:
      - kafka
  tb-rule-engine:
    env_file:
      - queue-kafka.env
    depends_on:
      - kafka
  tb-mqtt-transport:
    env_file:
      - queue-kafka.env
    depends_on:
      - kafka
  tb-http-transport:
    env_file:
      - queue-kafka.env
    depends_on:
      - kafka
  tb-coap-transport:
    env_file:
      - queue-kafka.env
    depends_on:
      - kafka
  tb-lwm2m-transport:
    env_file:
      - queue-kafka.env
    depends_on:
      - kafka
  tb-snmp-transport:
    env_file:
      - queue-kafka.env
    depends_on:
      - kafka
  tb-vc-executor:
    env_file:
      - queue-kafka.env
    depends_on:
      - kafka
